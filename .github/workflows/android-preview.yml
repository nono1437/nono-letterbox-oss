name: Build Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Restore stable public preview signature
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo '' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nono-letterbox-oss-preview.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nono-letterbox-oss-preview
          path: nono-letterbox-oss-preview.apk
          retention-days: 30
      - name: Publish rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f preview "$GITHUB_SHA"
          git push origin preview --force
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview nono-letterbox-oss-preview.apk --clobber
            gh release edit preview --title 'Android Preview' --notes '公开演示 APK：仅包含本地 demo、分类与回信功能，不包含 Gmail 或私人配置。'
          else
            gh release create preview nono-letterbox-oss-preview.apk --prerelease --title 'Android Preview' --notes '公开演示 APK：仅包含本地 demo、分类与回信功能，不包含 Gmail 或私人配置。'
          fi
